name: Validate and add a word

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  add-word:
    if: startsWith(github.event.issue.title, '[הוספת מילה]') && github.actor == github.repository_owner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the request and update the word file
        id: process
        continue-on-error: true
        run: node tools/process-word-request.js

      - name: Explain a rejected request
        if: steps.process.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/word-request-error.txt"

      - name: Stop after rejection
        if: steps.process.outcome == 'failure'
        run: exit 1

      - name: Commit the new word
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom-words.js
          git commit -m "Add English word from admin page"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload updated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm and close the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/word-request-success.txt"
          gh issue close "${{ github.event.issue.number }}"
